services:
  database:
    image: postgres:17-alpine
    container_name: workplayvpn-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workplayvpn-backend

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      VPN_NODE_NAME: ${VPN_NODE_NAME}
      VPN_NODE_HOST: ${VPN_NODE_HOST}
      VPN_NODE_SSH_PORT: ${VPN_NODE_SSH_PORT}
      VPN_NODE_SSH_USER: ${VPN_NODE_SSH_USER}
      VPN_NODE_SSH_KEY_PATH: ${VPN_NODE_SSH_KEY_PATH}
      VPN_REALITY_PUBLIC_KEY: ${VPN_REALITY_PUBLIC_KEY}
      VPN_REALITY_SNI: ${VPN_REALITY_SNI}
      VPN_REALITY_SHORT_ID: ${VPN_REALITY_SHORT_ID}
      VPN_REALITY_FINGERPRINT: ${VPN_REALITY_FINGERPRINT}
      VPN_REALITY_PORT: ${VPN_REALITY_PORT}

    volumes:
      - ./backend:/app
      - type: bind
        source: ${USERPROFILE}/.ssh/workplayvpn_backend
        target: /run/secrets/workplayvpn_backend
        read_only: true

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  subscription-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workplayvpn-subscription-worker

    command:
      [
        "python",
        "-m",
        "app.workers.subscription_expiry",
        "--interval",
        "60"
      ]

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      VPN_NODE_NAME: ${VPN_NODE_NAME}
      VPN_NODE_HOST: ${VPN_NODE_HOST}
      VPN_NODE_SSH_PORT: ${VPN_NODE_SSH_PORT}
      VPN_NODE_SSH_USER: ${VPN_NODE_SSH_USER}
      VPN_NODE_SSH_KEY_PATH: ${VPN_NODE_SSH_KEY_PATH}
      VPN_REALITY_PUBLIC_KEY: ${VPN_REALITY_PUBLIC_KEY}
      VPN_REALITY_SNI: ${VPN_REALITY_SNI}
      VPN_REALITY_SHORT_ID: ${VPN_REALITY_SHORT_ID}
      VPN_REALITY_FINGERPRINT: ${VPN_REALITY_FINGERPRINT}
      VPN_REALITY_PORT: ${VPN_REALITY_PORT}

    volumes:
      - ./backend:/app
      - type: bind
        source: ${USERPROFILE}/.ssh/workplayvpn_backend
        target: /run/secrets/workplayvpn_backend
        read_only: true

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: workplayvpn-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      - ./bot:/app
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: