services:
  database:
    image: postgres:17-alpine
    container_name: workplayvpn-database

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: workplayvpn-backend

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

      VPN_NODE_NAME: ${VPN_NODE_NAME}
      VPN_NODE_HOST: ${VPN_NODE_HOST}
      VPN_NODE_SSH_PORT: ${VPN_NODE_SSH_PORT}
      VPN_NODE_SSH_USER: ${VPN_NODE_SSH_USER}
      VPN_NODE_SSH_KEY_PATH: ${VPN_NODE_SSH_KEY_PATH}

      VPN_REALITY_PUBLIC_KEY: ${VPN_REALITY_PUBLIC_KEY}
      VPN_REALITY_SNI: ${VPN_REALITY_SNI}
      VPN_REALITY_SHORT_ID: ${VPN_REALITY_SHORT_ID}
      VPN_REALITY_FINGERPRINT: ${VPN_REALITY_FINGERPRINT}
      VPN_REALITY_PORT: ${VPN_REALITY_PORT}

      PAYMENT_DEFAULT_PROVIDER: ${PAYMENT_DEFAULT_PROVIDER}
      PAYMENT_MODE: ${PAYMENT_MODE}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL}
      PAYMENT_FAIL_URL: ${PAYMENT_FAIL_URL}
      PAYMENT_WEBHOOK_BASE_URL: ${PAYMENT_WEBHOOK_BASE_URL}

      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET}

      ROBOKASSA_MERCHANT_LOGIN: ${ROBOKASSA_MERCHANT_LOGIN}
      ROBOKASSA_PASSWORD_1: ${ROBOKASSA_PASSWORD_1}
      ROBOKASSA_PASSWORD_2: ${ROBOKASSA_PASSWORD_2}
      ROBOKASSA_HASH_ALGORITHM: ${ROBOKASSA_HASH_ALGORITHM}
      ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST}

      SUBSCRIPTION_TOKEN_SECRET: ${SUBSCRIPTION_TOKEN_SECRET}
      SUBSCRIPTION_BASE_URL: ${SUBSCRIPTION_BASE_URL}

    volumes:
      - ./backend:/app

      - type: bind
        source: ${USERPROFILE}/.ssh/workplayvpn_backend
        target: /run/secrets/workplayvpn_backend
        read_only: true

    ports:
      - "8000:8000"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  subscription-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: workplayvpn-subscription-worker

    command:
      [
        "python",
        "-m",
        "app.workers.subscription_expiry",
        "--interval",
        "60"
      ]

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

      SUBSCRIPTION_TOKEN_SECRET: ${SUBSCRIPTION_TOKEN_SECRET}
      SUBSCRIPTION_BASE_URL: ${SUBSCRIPTION_BASE_URL}

      VPN_NODE_NAME: ${VPN_NODE_NAME}
      VPN_NODE_HOST: ${VPN_NODE_HOST}
      VPN_NODE_SSH_PORT: ${VPN_NODE_SSH_PORT}
      VPN_NODE_SSH_USER: ${VPN_NODE_SSH_USER}
      VPN_NODE_SSH_KEY_PATH: ${VPN_NODE_SSH_KEY_PATH}

      VPN_REALITY_PUBLIC_KEY: ${VPN_REALITY_PUBLIC_KEY}
      VPN_REALITY_SNI: ${VPN_REALITY_SNI}
      VPN_REALITY_SHORT_ID: ${VPN_REALITY_SHORT_ID}
      VPN_REALITY_FINGERPRINT: ${VPN_REALITY_FINGERPRINT}
      VPN_REALITY_PORT: ${VPN_REALITY_PORT}

    volumes:
      - ./backend:/app

      - type: bind
        source: ${USERPROFILE}/.ssh/workplayvpn_backend
        target: /run/secrets/workplayvpn_backend
        read_only: true

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  payment-fulfillment-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: workplayvpn-payment-fulfillment-worker

    command:
      [
        "python",
        "-m",
        "app.workers.payment_fulfillment",
        "--interval",
        "10"
      ]

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

      SUBSCRIPTION_TOKEN_SECRET: ${SUBSCRIPTION_TOKEN_SECRET}
      SUBSCRIPTION_BASE_URL: ${SUBSCRIPTION_BASE_URL}
      CONNECT_BASE_URL: ${CONNECT_BASE_URL}

      VPN_NODE_NAME: ${VPN_NODE_NAME}
      VPN_NODE_HOST: ${VPN_NODE_HOST}
      VPN_NODE_SSH_PORT: ${VPN_NODE_SSH_PORT}
      VPN_NODE_SSH_USER: ${VPN_NODE_SSH_USER}
      VPN_NODE_SSH_KEY_PATH: ${VPN_NODE_SSH_KEY_PATH}

      VPN_REALITY_PUBLIC_KEY: ${VPN_REALITY_PUBLIC_KEY}
      VPN_REALITY_SNI: ${VPN_REALITY_SNI}
      VPN_REALITY_SHORT_ID: ${VPN_REALITY_SHORT_ID}
      VPN_REALITY_FINGERPRINT: ${VPN_REALITY_FINGERPRINT}
      VPN_REALITY_PORT: ${VPN_REALITY_PORT}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_PROXY_URL: socks5://telegram-egress:1080

    volumes:
      - ./backend:/app

      - type: bind
        source: ${USERPROFILE}/.ssh/workplayvpn_backend
        target: /run/secrets/workplayvpn_backend
        read_only: true

    depends_on:
      database:
        condition: service_healthy

      telegram-egress:
        condition: service_healthy

    restart: unless-stopped

  test-database:
    image: postgres:17-alpine
    container_name: workplayvpn-test-database

    environment:
      POSTGRES_DB: workplayvpn_test
      POSTGRES_USER: workplayvpn_test
      POSTGRES_PASSWORD: workplayvpn_test

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U workplayvpn_test -d workplayvpn_test"
        ]
      interval: 2s
      timeout: 5s
      retries: 15

    profiles:
      - testing

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"

    environment:
      DATABASE_URL: postgresql+psycopg://workplayvpn_test:workplayvpn_test@test-database:5432/workplayvpn_test

      CONNECT_BASE_URL: https://connect.test.local/connect/happ

      VPN_NODE_NAME: WorkPlayVPN-Test
      VPN_NODE_HOST: 127.0.0.1
      VPN_NODE_SSH_PORT: "22"
      VPN_NODE_SSH_USER: test
      VPN_NODE_SSH_KEY_PATH: /tmp/test-key

      VPN_REALITY_PUBLIC_KEY: test-public-key
      VPN_REALITY_SNI: example.com
      VPN_REALITY_SHORT_ID: 0000000000000000
      VPN_REALITY_FINGERPRINT: chrome
      VPN_REALITY_PORT: "443"

      PAYMENT_DEFAULT_PROVIDER: test
      PAYMENT_MODE: test
      PAYMENT_SUCCESS_URL: ""
      PAYMENT_FAIL_URL: ""
      PAYMENT_WEBHOOK_BASE_URL: ""

      CLOUDPAYMENTS_PUBLIC_ID: ""
      CLOUDPAYMENTS_API_SECRET: ""

      ROBOKASSA_MERCHANT_LOGIN: ""
      ROBOKASSA_PASSWORD_1: ""
      ROBOKASSA_PASSWORD_2: ""
      ROBOKASSA_HASH_ALGORITHM: sha256
      ROBOKASSA_IS_TEST: "true"

      SUBSCRIPTION_TOKEN_SECRET: test-subscription-secret
      SUBSCRIPTION_BASE_URL: https://sub.test.local/sub

    volumes:
      - ./backend:/app

    depends_on:
      test-database:
        condition: service_healthy

    command:
      [
        "sh",
        "-lc",
        "python -c \"from sqlalchemy import create_engine, text; from app.core.config import settings; engine=create_engine(settings.database_url); conn=engine.connect(); conn.execute(text('DROP SCHEMA public CASCADE')); conn.execute(text('CREATE SCHEMA public')); conn.commit(); conn.close(); engine.dispose()\" && alembic upgrade head && pytest -q tests"
      ]

    profiles:
      - testing

  payment-expiry-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: workplayvpn-payment-expiry-worker

    command:
      [
        "python",
        "-m",
        "app.workers.payment_expiry",
        "--interval",
        "60"
      ]

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

    volumes:
      - ./backend:/app

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  telegram-egress:
    build:
      context: ./telegram-egress
      dockerfile: Dockerfile

    container_name: workplayvpn-telegram-egress

    environment:
      TELEGRAM_EGRESS_HOST: ${TELEGRAM_EGRESS_HOST}
      TELEGRAM_EGRESS_USER: ${TELEGRAM_EGRESS_USER}
      TELEGRAM_EGRESS_SSH_KEY: /run/secrets/workplayvpn_telegram_egress

    volumes:
      - type: bind
        source: ${USERPROFILE}/.ssh/workplayvpn_telegram_egress
        target: /run/secrets/workplayvpn_telegram_egress
        read_only: true

      - type: bind
        source: ./telegram-egress/known_hosts
        target: /run/secrets/known_hosts
        read_only: true

    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile

    container_name: workplayvpn-bot

    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_URL: ${BACKEND_URL}
      TELEGRAM_PROXY_URL: socks5://telegram-egress:1080

    volumes:
      - ./bot:/app

    depends_on:
      backend:
        condition: service_healthy

      telegram-egress:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: